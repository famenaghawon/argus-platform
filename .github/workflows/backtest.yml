name: Backtest

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run backtest
        run: |
          if [ -f src/argus/evaluation/backtest.py ]; then
            python -m argus.evaluation.backtest || echo "backtest skipped (not yet implemented)"
          else
            echo "backtest.py not yet implemented — placeholder only"
          fi